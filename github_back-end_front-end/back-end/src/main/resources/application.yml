spring:
  application:
    name: eKauplus

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:your_email@gmail.com}
    password: ${EMAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:defaultSecretKey123456789012345678901234567890}
  expiration: 86400000
  refresh:
    expiration: 604800000

aws:
  s3:
    region: eu-north-1
    bucket-name: your-bucket-name
  access-key: ${AWS_ACCESS_KEY:your_aws_access_key}
  secret-key: ${AWS_SECRET_KEY:your_aws_secret_key}

app:
  frontend:
    url: http://localhost:3000

logging:
  level:
    org.springframework.security: DEBUG
    com.ekauplus: DEBUG